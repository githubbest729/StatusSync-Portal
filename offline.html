<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B132B">
<title>StatusSync — Offline</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0B132B; color:#E6F1FF; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:24px; }
  main { max-width:460px; text-align:center; }
  .ring { width:96px; height:96px; margin:0 auto 24px; border-radius:50%; border:4px solid #3A86FF; box-shadow:0 0 0 8px rgba(0,245,212,.18), 0 0 32px rgba(0,245,212,.35); display:grid; place-items:center; font-weight:800; font-size:32px; color:#00F5D4; }
  h1 { margin:0 0 8px; font-size:1.5rem; }
  p { color:#B8C7DC; line-height:1.55; }
  button { margin-top:16px; background:#00F5D4; color:#0B132B; border:0; border-radius:8px; padding:12px 22px; font-weight:700; font-size:1rem; cursor:pointer; }
  button:focus-visible { outline:3px solid #fff; outline-offset:2px; }
</style>
</head>
<body>
<main>
  <div class="ring" aria-hidden="true">SS</div>
  <h1>You are offline</h1>
  <p>StatusSync could not reach the network and this page is not cached yet. Your saved projects, broadcasts and attachments stay on this device. Reopen the portal once you are connected, or retry below.</p>
  <button type="button" onclick="location.href='./index.html'">Open StatusSync</button>
</main>
</body>
</html>
